<!DOCTYPE html>
<html>
<head>
<style>
img {
  position: absolute;
  left: 0px;
  top: 0px;
  height: 300px;
  width: 400px;
  z-index: -1;
}
</style>
</head>
<body>

<h1>HEADING</h1>    
<img src="image.jpeg">
<p>Because the image has a z-index of -1, it will be placed behind the text </p>

</body>
</html>
